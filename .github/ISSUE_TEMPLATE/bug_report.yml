name: 🐞 Bug 报告
description: 功能异常、报错、界面卡住、启动失败等
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        提交之前请先看一眼 README 的「🆘 新手常见问题」—— 相当一部分启动问题在那里就有答案。
        另外：**请不要贴 API Key**，贴日志前先把密钥那几行删掉。
  - type: input
    id: node
    attributes:
      label: Node.js 版本
      description: 命令行执行 `node -v` 的输出（本项目需要 22.13 或更高）
      placeholder: v24.19.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 其它
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 分支
      description: 例如 v1.1.1（Experimental-Version-v1.0）；不确定就写「不确定」
      placeholder: v1.1.1 (Experimental-Version-v1.0)
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 期望的行为 vs 实际的行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开「正文写作」
        2. 点工具栏「✍️ AI 写作」
        3. ……
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 报错原文 / 日志
      description: 服务窗口里的报错，或侧栏「🧾 日志」页里的记录（记得删掉 API Key）
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: confirms
    attributes:
      label: 确认
      options:
        - label: 我贴出的内容里没有包含 API Key 或作品正文
          required: true
        - label: 我已经在「🆘 新手常见问题」和 issue 列表里搜过同样的问题
          required: true
