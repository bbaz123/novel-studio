<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel Studio · 小说创作工坊</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar collapsed">
      <div class="sidebar-head">
        <button class="icon-btn" data-action="back-works" title="返回作品列表">🏠</button>
        <span class="sidebar-logo">📖</span>
        <div class="sidebar-title" id="sidebar-title">Novel Studio</div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <button data-view="works" title="管理你的所有小说项目（初始页默认显示）">📚 我的作品</button>
        <button data-view="ai-create" title="没进作品时可用：AI 自动创建整本小说 / 创作工作台 / 任务历史 / AI 设置">✨ AI 创作</button>
        <button data-view="overview" title="当前作品的数据统计：章节、设定词条、角色、剧情线">📊 总览</button>
        <button data-view="writing" title="写正文的地方：左侧选章节，右侧写内容（自动保存）；切三栏可看参考面板">✍️ 正文写作</button>
        <button data-view="settings" title="设定集中管理：剧情线（按线索看）/ 大纲（按卷章看）/ 设定库 / 角色 / 长期记忆">📘 小说设定</button>
        <button data-view="ai-board" title="只看 AI 相关设置：AI 设置（模型 API、记忆库、创作内核）/ SillyTavern 设置（角色卡与作者注）">🤖 AI创造板块</button>
        <button data-view="trace" title="排查问题用：把每次操作跑了哪些代码、花了多久、调了什么 AI 录成可回看的调用链。正常写作可以无视">🐞 运行追踪</button>
        <button data-view="logs" title="排查问题用：错误、慢操作、进程异常的记录。正常写作可以无视">🧾 日志</button>
      </nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn sidebar-toggle" id="sidebar-toggle" title="折叠/展开侧栏">◀</button>
          <span class="topbar-title" id="topbar-title">Novel Studio</span>
        </div>
        <div class="search-box">
          <input type="search" id="global-search" placeholder="全局搜索设定 / 大纲 / 正文 / 角色..." autocomplete="off">
          <div class="search-results" id="search-results" hidden></div>
        </div>
        <div class="topbar-right" id="topbar-right"></div>
      </header>
      <main id="content" class="content"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="tooltip" class="tooltip" hidden></div>
  <div id="ai-task-progress" class="ai-task-progress" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
